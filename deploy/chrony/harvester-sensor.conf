# Include from chrony.conf or chrony.conf.d on the offline Orin. The PLC's
# battery-backed RTC is the persistent UTC authority on the sensor LAN.
#
# Install: this file is included by /etc/chrony/chrony.conf (the deployment
# already does so; verify with `grep harvester-sensor /etc/chrony/chrony.conf`).
server 192.168.50.40 iburst prefer
# If the PLC NTP server is slow to answer at boot, step the clock rather than
# slewing for hours. The PLC RTC can be minutes off after a long power-off.
makestep 1.0 3
# Keep the Orin's own RTC updated when available. It is only a short-term
# fallback; the PLC RTC remains authoritative after a power loss.
rtcsync
driftfile /var/lib/chrony/harvester-sensor.drift
allow 192.168.50.0/24

# --- Why the Orin clock must be disciplined ---------------------------------
# The MID-360 does NOT run a UTC clock of its own (see deploy/ptp/). When the
# LiDAR is not PTP/GPS-synchronized, the LiDAR adapter timestamps each scan with
# the Orin's CLOCK_REALTIME at packet arrival. That number is only real UTC if
# THIS host is itself synchronized. In that fallback path chrony is what makes
# the published LiDAR timestamps meaningful, so an unsynchronized Orin degrades
# the LiDAR timestamps from "±NTP offset" to "whatever the RTC happened to say".
#
# Diagnose with:
#   chronyc tracking      # want: Leap status Normal, System time small
#   chronyc sources -v    # want: '^ 192.168.50.40' with a reachable reach reg
# A source shown as '^?' (unreachable) and Reference ID 7F7F0101 with Stratum 10
# means chrony fell back to its own `local` clock: the Orin is NOT synced, and
# 'local stratum 10 orphan' below is what lets it pretend otherwise.

# Preserve a usable last PLC-disciplined clock during a PLC link outage. This
# keeps the system clock monotonic and roughly right rather than jumping to
# 1970, but while it is active `chronyc tracking` reports stratum 10 and the
# adapter's time_quality becomes "holdover" (not "synchronized").
local stratum 10 orphan
