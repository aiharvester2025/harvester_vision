# Include from chrony.conf or chrony.conf.d on the offline Orin. The PLC's
# battery-backed RTC is the persistent UTC authority on the sensor LAN.
server 192.168.50.40 iburst prefer
makestep 1.0 3
# Keep the Orin's own RTC updated when available. It is only a short-term
# fallback; the PLC RTC remains authoritative after a power loss.
rtcsync
driftfile /var/lib/chrony/harvester-sensor.drift
allow 192.168.50.0/24
# Preserve a usable last PLC-disciplined clock during a PLC link outage.
local stratum 10 orphan
