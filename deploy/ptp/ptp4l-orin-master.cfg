# linuxptp ptp4l configuration: make the ORIN the PTP MASTER for the MID-360.
#
# Why this file exists
# --------------------
# The Livox MID-360 does NOT keep a UTC clock of its own. Its point-packet
# timestamp only becomes real time while the device is slaved to a time master:
# PTP/gPTP (from this host) or GPS. Livox's protocol makes the LiDAR the PTP
# *slave* always, so the Orin must be the master. With no master, packets carry
# time_type==0 ("time since device power-on") and must not be published as UTC.
#
# Run (see deploy/ptp/setup_ptp_master.sh, which does this and verifies it):
#   ptp4l -i eth1 -f /etc/linuxptp/ptp4l-orin-master.cfg -m
#
# IMPORTANT HARDWARE CAVEAT (verified on this Orin NX dev kit)
# ----------------------------------------------------------
# The sensor NIC here is `eth1` = Realtek RTL8168 (`r8168` driver), which
# exposes NO PTP hardware clock and no hardware timestamping: only /dev/ptp0
# exists, and it belongs to `eth0` (Microchip lan743x, the desk/WAN NIC whose
# MAC matches ptp0's clock_name). ptp4l therefore falls back to SOFTWARE
# timestamping (`time_stamping software` below). Software timestamps add
# microseconds-to-milliseconds of NIC/IRQ/scheduler jitter, which is acceptable
# for a LiDAR scan timestamp but is NOT a precision time-transfer setup.
#
# If the MID-360 can be moved onto a PTP-capable NIC (one with its own PHC),
# switch `time_stamping` to `hardware` and point ptp4l/phc2sys at that
# interface for ~sub-microsecond accuracy. Verify with `ethtool -T <iface>`:
# you need SOF_TIMESTAMPING_RAW_HARDWARE (plus TX/RX hardware flags).

[global]
# LiDAR is the slave; this host is the grandmaster on the sensor LAN.
# 128 = preferred master, so the LiDAR chooses us immediately.
priority1               128
priority2               128
clockClass              248
clockAccuracy           0xFE
offsetScaledLogVariance 0xFFFF
gmCapable               1
# PTPv2 domain 0 (Livox supports IEEE1588v2.0; v2.1 is NOT supported).
domainNumber            0
# Do not let this host be captured as a slave by another master: multiple
# masters on one network are explicitly unsupported by Livox, and we are the
# intended grandmaster here.
slaveOnly               0
network_transport       UDPv4
delay_mechanism         E2E
# Two-step timestamps: the MID-360 implements two-step delay request-response.
twoStepFlag             1
# Software timestamping is mandatory on r8168 (no PHC). See the caveat above.
time_stamping           software
# Only the sensor LAN: never announce PTP on the desk/WAN NIC.
# (ptp4l is given `-i eth1`; this is documentation of intent, not a ptp4l key.)
logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0
announceReceiptTimeout  3
