<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860"
     viewBox="0 0 1180 860" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3a5c"/>
    </marker>
    <marker id="arow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5"
            orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1180" height="860" fill="#fbfbf7"/>
  <text x="590" y="34" font-size="22" font-weight="bold" text-anchor="middle"
        fill="#123">HARVESTER DOCK GEOMETRY  —  side view (X-Z plane)</text>
  <text x="590" y="58" font-size="13" text-anchor="middle" fill="#456">
        Numbers = live Xavier plan output: H_dock 7.00 m, d_horiz 9.27 m,
        boom 32.17 deg, extension 7.35 m</text>

  <!-- ============ GROUND ============ -->
  <line x1="60" y1="760" x2="1120" y2="760" stroke="#2c3e50" stroke-width="3"/>
  <g stroke="#7f8c8d" stroke-width="1">
    <line x1="80" y1="760" x2="60" y2="772"/><line x1="110" y1="760" x2="90" y2="772"/>
    <line x1="140" y1="760" x2="120" y2="772"/><line x1="170" y1="760" x2="150" y2="772"/>
    <line x1="200" y1="760" x2="180" y2="772"/><line x1="230" y1="760" x2="210" y2="772"/>
    <line x1="260" y1="760" x2="240" y2="772"/><line x1="290" y1="760" x2="270" y2="772"/>
    <line x1="320" y1="760" x2="300" y2="772"/><line x1="350" y1="760" x2="330" y2="772"/>
    <line x1="380" y1="760" x2="360" y2="772"/><line x1="410" y1="760" x2="390" y2="772"/>
    <line x1="440" y1="760" x2="420" y2="772"/><line x1="470" y1="760" x2="450" y2="772"/>
    <line x1="500" y1="760" x2="480" y2="772"/><line x1="530" y1="760" x2="510" y2="772"/>
    <line x1="560" y1="760" x2="540" y2="772"/><line x1="590" y1="760" x2="570" y2="772"/>
    <line x1="620" y1="760" x2="600" y2="772"/><line x1="650" y1="760" x2="630" y2="772"/>
    <line x1="680" y1="760" x2="660" y2="772"/><line x1="710" y1="760" x2="690" y2="772"/>
    <line x1="740" y1="760" x2="720" y2="772"/><line x1="770" y1="760" x2="750" y2="772"/>
    <line x1="800" y1="760" x2="780" y2="772"/><line x1="830" y1="760" x2="810" y2="772"/>
    <line x1="860" y1="760" x2="840" y2="772"/><line x1="890" y1="760" x2="870" y2="772"/>
    <line x1="920" y1="760" x2="900" y2="772"/><line x1="950" y1="760" x2="930" y2="772"/>
    <line x1="980" y1="760" x2="960" y2="772"/><line x1="1010" y1="760" x2="990" y2="772"/>
    <line x1="1040" y1="760" x2="1020" y2="772"/><line x1="1070" y1="760" x2="1050" y2="772"/>
    <line x1="1100" y1="760" x2="1080" y2="772"/>
  </g>
  <text x="70" y="790" font-size="14" fill="#2c3e50">GROUND  (world z = 0)</text>

  <!-- ============ SCALE: 1 m = 55 px, ground y=760, pivot x=210 ============ -->
  <!-- pivot world x=-0.87 -> ground 210 ; trunk world x=8.5 -> 210+9.37*55=725 -->
  <!-- trunk x pixel = 210 + (8.5 - (-0.87)) * 55 = 210 + 9.37*55 = 725.4 -->
  <!-- pivot z 1.81 -> y = 760 - 1.81*55 = 660.5 -->
  <!-- H_dock 7.0  -> y = 760 - 7.0*55  = 375 -->
  <!-- crown 9.0   -> y = 760 - 9.0*55  = 265 -->
  <!-- top 11.8    -> y = 760 - 11.8*55 = 111 -->

  <!-- ============ TREE ============ -->
  <!-- trunk: width ~0.5 m = 27 px -->
  <rect x="712" y="265" width="27" height="495" fill="#8d6e63" opacity="0.85"/>
  <text x="762" y="300" font-size="13" fill="#6d4c41">TRUNK</text>
  <text x="762" y="318" font-size="12" fill="#6d4c41">world x = 8.5</text>

  <!-- crown / fronds -->
  <g fill="#2e7d32" opacity="0.85">
    <ellipse cx="725" cy="235" rx="120" ry="62"/>
  </g>
  <g stroke="#2e7d32" stroke-width="3" fill="none">
    <path d="M725,265 C660,240 610,200 585,160"/>
    <path d="M725,265 C680,230 650,175 640,130"/>
    <path d="M725,265 C725,225 715,160 712,105"/>
    <path d="M725,265 C770,230 800,175 812,130"/>
    <path d="M725,265 C790,240 840,200 866,160"/>
  </g>
  <text x="862" y="120" font-size="13" fill="#1b5e20">CROWN (fronds/FFB)</text>
  <text x="500" y="120" font-size="12" fill="#1b5e20">tree top 11.80 m</text>
  <line x1="600" y1="111" x2="705" y2="111" stroke="#1b5e20"
        stroke-width="1" stroke-dasharray="4 3"/>

  <!-- crown base marker -->
  <line x1="640" y1="265" x2="880" y2="265" stroke="#1b5e20"
        stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="884" y="262" font-size="13" fill="#1b5e20">crown base 9.00 m</text>
  <text x="884" y="279" font-size="11" fill="#1b5e20">(trunk END — dock reference)</text>

  <!-- docking point -->
  <circle cx="712" cy="375" r="8" fill="#c0392b"/>
  <text x="500" y="380" font-size="13" font-weight="bold" fill="#c0392b"
        text-anchor="end">DOCKING POINT</text>
  <text x="500" y="397" font-size="12" fill="#c0392b" text-anchor="end">H_dock = 7.00 m</text>

  <!-- ============ MACHINE ============ -->
  <!-- base body -->
  <rect x="90" y="640" width="150" height="120" rx="8"
        fill="#546e7a" stroke="#263238" stroke-width="2"/>
  <text x="165" y="690" font-size="13" fill="#fff" text-anchor="middle">MACHINE</text>
  <text x="165" y="708" font-size="12" fill="#cfd8dc" text-anchor="middle">base_link</text>
  <text x="165" y="726" font-size="11" fill="#cfd8dc" text-anchor="middle">world x = 0</text>

  <!-- wheels -->
  <circle cx="130" cy="762" r="20" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <circle cx="210" cy="762" r="20" fill="#37474f" stroke="#263238" stroke-width="2"/>

  <!-- BOOM PIVOT -->
  <circle cx="210" cy="660" r="9" fill="#f39c12" stroke="#b9770e" stroke-width="2"/>
  <text x="196" y="648" font-size="13" font-weight="bold" fill="#b9770e"
        text-anchor="end">BOOM PIVOT</text>
  <text x="196" y="632" font-size="11" fill="#b9770e" text-anchor="end">z = 1.81 m, x = -0.87</text>

  <!-- BOOM: 32.17 deg, total reach 9.75 m = 536 px -->
  <!-- tip = pivot + 9.75m at 32.17deg : dx=8.25m->453px, dz=5.19m->285px -->
  <!-- tip x = 210 + (8.25+1.02)*55 ... actually L_needed measured from pivot:
       dx_total_from_pivot = 9.27-1.02+1.02 = 9.27 -> but boom reaches c-channel
       Use pivot -> dock: horizontal (9.27-1.02)=8.25 m, vertical (7.0-1.81)=5.19 m -->
  <line x1="210" y1="660" x2="664" y2="375" stroke="#f39c12" stroke-width="12"
        stroke-linecap="round"/>
  <line x1="210" y1="660" x2="664" y2="375" stroke="#ffd54f" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="14 8"/>
  <text x="380" y="500" font-size="14" font-weight="bold" fill="#b9770e"
        transform="rotate(-31 380 500)">BOOM  —  fixed 2.40 m + extension 7.35 m</text>

  <!-- angle arc -->
  <path d="M 300 660 A 90 90 0 0 0 285 613" fill="none" stroke="#c0392b"
        stroke-width="2"/>
  <text x="312" y="640" font-size="14" font-weight="bold" fill="#c0392b">
        boom_angle = 32.17&#176;</text>

  <!-- ============ DIMENSION: d_horiz ============ -->
  <line x1="210" y1="812" x2="725" y2="812" stroke="#1b3a5c" stroke-width="1.6"/>
  <line x1="210" y1="805" x2="210" y2="819" stroke="#1b3a5c" stroke-width="1.6"/>
  <line x1="725" y1="805" x2="725" y2="819" stroke="#1b3a5c" stroke-width="1.6"/>
  <text x="467" y="834" font-size="15" font-weight="bold" fill="#1b3a5c"
        text-anchor="middle">distance_m = 9.27 m</text>
  <text x="467" y="851" font-size="12" fill="#1b3a5c" text-anchor="middle">
        horizontal: boom PIVOT to TRUNK centreline</text>

  <!-- ============ DIMENSION: extension bracket ============ -->
  <line x1="1120" y1="660" x2="1120" y2="760" stroke="#1b3a5c" stroke-width="1.6"/>

  <!-- ============ DIMENSION: H_dock ============ -->
  <line x1="860" y1="375" x2="1080" y2="375" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="1080" y1="375" x2="1080" y2="760" stroke="#c0392b" stroke-width="1.6"
        stroke-dasharray="5 4"/>
  <line x1="860" y1="375" x2="860" y2="760" stroke="#c0392b" stroke-width="1.6"
        stroke-dasharray="5 4"/>
  <line x1="852" y1="760" x2="1088" y2="760" stroke="#c0392b" stroke-width="1.6"/>
  <text x="970" y="590" font-size="15" font-weight="bold" fill="#c0392b"
        text-anchor="middle" transform="rotate(-90 970 590)">H_dock = 7.00 m</text>

  <!-- ============ LEVEL PLATFORM CALLOUT (top-left panel) ============ -->
  <g transform="translate(70,90)">
    <rect x="0" y="0" width="470" height="235" rx="10"
          fill="#fff8e1" stroke="#f39c12" stroke-width="2"/>
    <text x="235" y="28" font-size="15" font-weight="bold" fill="#b9770e"
          text-anchor="middle">WHY boom_angle = leveling_angle (both 32.17&#176;)</text>

    <!-- boom vector -->
    <line x1="40" y1="150" x2="170" y2="85" stroke="#f39c12" stroke-width="10"
          stroke-linecap="round"/>
    <circle cx="40" cy="150" r="6" fill="#b9770e"/>
    <text x="30" y="172" font-size="11" fill="#b9770e">boom pivot</text>
    <text x="120" y="70" font-size="12" fill="#c0392b">+32.17&#176;  (tip UP)</text>
    <text x="196" y="96" font-size="11" fill="#7f8c8d">elev axis (0,-1,0)</text>

    <!-- platform bar before/after -->
    <line x1="196" y1="98" x2="300" y2="98" stroke="#7f8c8d" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="6 4"/>
    <text x="304" y="102" font-size="11" fill="#7f8c8d">tilted mount</text>

    <line x1="196" y1="150" x2="300" y2="150" stroke="#2e7d32" stroke-width="9"
          stroke-linecap="round"/>
    <text x="304" y="154" font-size="12" font-weight="bold" fill="#2e7d32">FLAT &#10003;</text>
    <circle cx="196" cy="150" r="6" fill="#2e7d32"/>
    <text x="150" y="140" font-size="12" fill="#2e7d32">+32.17&#176;</text>
    <text x="196" y="176" font-size="11" fill="#7f8c8d">level axis (0,+1,0)</text>

    <text x="16" y="206" font-size="12" fill="#4e342e">
      Axes are OPPOSITE, so the SAME +32.17&#176; cancels the boom tilt.</text>
    <text x="16" y="224" font-size="12" fill="#c0392b">
      A MINUS command would ADD (&#8776;66&#176;) and miss by ~1 m.</text>
  </g>

  <!-- ============ LEGEND (bottom-right) ============ -->
  <g transform="translate(880,90)">
    <rect x="0" y="0" width="230" height="150" rx="10"
          fill="#fff" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="14" y="26" font-size="14" font-weight="bold" fill="#123">LEGEND</text>
    <line x1="14" y1="48" x2="46" y2="48" stroke="#f39c12" stroke-width="8"
          stroke-linecap="round"/>
    <text x="56" y="52" font-size="12" fill="#37474f">boom (telescopic)</text>
    <line x1="14" y1="76" x2="46" y2="76" stroke="#c0392b" stroke-width="3"/>
    <text x="56" y="80" font-size="12" fill="#37474f">dock point / H_dock</text>
    <line x1="14" y1="104" x2="46" y2="104" stroke="#1b5e20" stroke-width="1.5"
          stroke-dasharray="7 4"/>
    <text x="56" y="108" font-size="12" fill="#37474f">crown base (trunk end)</text>
    <line x1="14" y1="132" x2="46" y2="132" stroke="#1b3a5c" stroke-width="1.6"/>
    <text x="56" y="136" font-size="12" fill="#37474f">dimension</text>
  </g>

  <!-- vertical note for extension vs distance -->
  <g transform="translate(70,300)">
    <rect x="0" y="0" width="330" height="122" rx="10"
          fill="#e8f0fe" stroke="#1b3a5c" stroke-width="1.5"/>
    <text x="165" y="24" font-size="14" font-weight="bold" fill="#1b3a5c"
          text-anchor="middle">distance vs extension</text>
    <text x="14" y="50" font-size="12" fill="#37474f">
      distance_m     = 9.27 m  &#8594;  WHERE the tree is</text>
    <text x="14" y="70" font-size="12" fill="#37474f">
      boom_extension = 7.35 m  &#8594;  HOW FAR to push out</text>
    <text x="14" y="94" font-size="12" fill="#37474f">
      total reach = hypot(8.25, 5.19) = 9.75 m</text>
    <text x="14" y="112" font-size="12" fill="#37474f">
      = fixed 2.40 m + extension 7.35 m</text>
  </g>
</svg>
